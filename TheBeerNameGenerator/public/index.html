<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- NL: Voorkom verouderde cache en maak paden consistent -->
    <meta
      http-equiv="Cache-Control"
      content="no-store, no-cache, must-revalidate, max-age=0"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <base href="./" />
    <title>The Beer Name Generator</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Fonts: Better beer vibe with more variety -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Great+Vibes&family=Bebas+Neue&family=Roboto:wght@300;400;500&family=Uncial+Antiqua&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- External CSS (cache-busting) -->
    <link rel="stylesheet" href="styles.css?v=2025-10-27-1" />
  </head>

  <body>
    <!-- NL: Achtergrond-bubbels over de hele pagina -->
    <div id="bubbles-bg" class="bubbles-bg" aria-hidden="true"></div>
    <!-- NL: Volledige container voor de applicatie -->
    <div class="fullscreen-container">
      <header class="main-header">
        <h1>The Beer Name Generator</h1>
        <p>Craft the perfect name for your brew</p>
      </header>

      <div class="main-content">
        <section class="beer-generator">
          <h2>Conjure Your Mythic Brew</h2>

          <!-- NL: Resultaatgedeelte met naam + specificaties -->
          <div class="result-container">
            <div class="beer-name-container">
              <div class="bubbles" id="bubbles"></div>
              <div class="beer-specs" id="beer-specs" aria-live="polite">
                <div id="random-name" class="beer-name-text" aria-live="polite">
                  Click below and savor the surprise!
                </div>
              </div>
            </div>
          </div>

          <!-- NL: Knoppen en statusbalk -->
          <div class="controls-area">
            <div class="button-group">
              <button
                type="button"
                class="btn primary-btn"
                id="generate"
                aria-label="Generate new beer name"
              >
                <i class="fas fa-beer" aria-hidden="true"></i> Generate
              </button>

              <button
                type="button"
                class="btn secondary-btn"
                id="auto-generate"
                aria-label="Automatically generate beer names every 10 seconds"
              >
                <i class="fas fa-sync-alt" aria-hidden="true"></i> Auto Generate
              </button>
            </div>

            <div class="status-bar">
              <div class="status-info">
                <span id="generation-count">0 beers crafted</span>
              </div>
              <button
                type="button"
                class="theme-toggle"
                id="theme-toggle"
                aria-label="Toggle dark mode"
              >
                <i class="fas fa-moon" aria-hidden="true"></i> Dark Mode
              </button>
            </div>
          </div>
        </section>

        <!-- NL: Geschiedenis paneel -->
        <button
          type="button"
          id="history-toggle"
          title="View History"
          aria-label="View beer history"
          aria-expanded="false"
          aria-controls="history-panel"
        >
          <i class="fas fa-history" aria-hidden="true"></i>
        </button>

        <section
          class="history"
          id="history-panel"
          aria-labelledby="history-heading"
        >
          <h3 id="history-heading">
            <span>Brewing History</span>
            <button
              type="button"
              class="clear-btn"
              id="clear-history"
              aria-label="Clear history"
            >
              <i class="fas fa-trash" aria-hidden="true"></i> Clear
            </button>
          </h3>

          <div id="history-list" aria-live="polite">
            <!-- History items will be added here -->
          </div>
        </section>
      </div>

      <footer class="main-footer">
        <p>🍻 © 2025 Beer Name Generator | Crafted with ❤️ by Yoshi Tacke</p>
      </footer>
    </div>

    <!-- Axios for HTTP requests -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Main JavaScript (cache-busting) -->
    <script src="main.js?v=2025-10-27-1" defer></script>
  </body>
</html>
