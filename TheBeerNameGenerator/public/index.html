<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Beer Name Generator</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bubbles-bg" id="bubbles-bg" aria-hidden="true"></div>

    <div class="layout">

      <!-- Header -->
      <header class="header">
        <div class="header__left">
          <span class="header__icon" aria-hidden="true">🍺</span>
          <div>
            <h1 class="header__title">Beer Name Generator</h1>
            <p class="header__sub">Craft the perfect name for your brew</p>
          </div>
        </div>
        <div class="header__right">
          <span id="generation-count" class="header__count">0 brews crafted</span>
          <button type="button" class="btn btn--icon" id="theme-toggle" aria-label="Toggle dark mode">
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </header>

      <!-- 3-column body -->
      <div class="content">

        <!-- Left sidebar: Customize + Stats -->
        <aside class="sidebar">
          <section class="card">
            <h2 class="card__title"><i class="fas fa-sliders-h"></i> Customize</h2>
            <div class="field">
              <label class="field__label" for="category-select">Category</label>
              <select class="field__select" id="category-select"><option value="random">Random</option></select>
            </div>
            <div class="field">
              <label class="field__label" for="adjective-select">Adjective</label>
              <select class="field__select" id="adjective-select"><option value="random">Random</option></select>
            </div>
            <div class="field">
              <label class="field__label" for="style-select">Style</label>
              <select class="field__select" id="style-select"><option value="random">Random</option></select>
            </div>
          </section>

          <section class="card card--grow">
            <h2 class="card__title"><i class="fas fa-chart-bar"></i> Stats</h2>
            <div id="stats-list"><p class="muted">Generate beers to see stats.</p></div>
          </section>
        </aside>

        <!-- Center: brew card + actions -->
        <main class="main">
          <div class="brew-card">
            <div class="brew-card__foam" aria-hidden="true"></div>
            <div class="brew-card__bubbles" id="card-bubbles" aria-hidden="true"></div>
            <div class="brew-card__body">
              <p class="brew-card__prompt" id="brew-prompt">Click Generate and savor the surprise</p>
              <div id="brew-name" class="brew-card__name" aria-live="polite" hidden></div>
              <div id="brew-desc" class="brew-card__desc" aria-live="polite" hidden></div>
              <div id="brew-specs" class="brew-card__specs" aria-live="polite" hidden></div>
            </div>
          </div>

          <div class="actions">
            <button type="button" class="btn btn--primary" id="generate">
              <i class="fas fa-magic"></i> Generate
            </button>
            <button type="button" class="btn btn--secondary" id="auto-generate" aria-pressed="false">
              <i class="fas fa-sync-alt"></i> Auto
            </button>
            <button type="button" class="btn btn--ghost" id="save-favorite">
              <i class="fas fa-heart"></i> Save
            </button>
            <button type="button" class="btn btn--ghost" id="share-beer">
              <i class="fas fa-share-alt"></i> Share
            </button>
            <button type="button" class="btn btn--ghost" id="generate-image">
              <i class="fas fa-image"></i> Image
            </button>
          </div>
        </main>

        <!-- Right sidebar: Favorites + History -->
        <aside class="sidebar">
          <section class="card card--grow">
            <h2 class="card__title"><i class="fas fa-heart"></i> Favorites</h2>
            <div id="favorites-list" class="scroll-list" aria-live="polite"><p class="muted">No favorites yet.</p></div>
          </section>

          <section class="card card--grow">
            <div class="card__title-row">
              <h2 class="card__title"><i class="fas fa-history"></i> Recent</h2>
              <button type="button" class="btn btn--danger btn--sm" id="clear-history">
                <i class="fas fa-trash"></i>
              </button>
            </div>
            <div id="history-list" class="scroll-list" aria-live="polite"></div>
          </section>
        </aside>

      </div>

      <footer class="footer">
        🍻 Crafted with ❤️ by Yoshi Tacke · 2025
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
