<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- NL: Voorkom verouderde cache en maak paden consistent -->
    <meta
      http-equiv="Cache-Control"
      content="no-store, no-cache, must-revalidate, max-age=0"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <base href="./" />
    <title>The Beer Name Generator</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Fonts: Better beer vibe with more variety -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Great+Vibes&family=Bebas+Neue&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- External CSS (cache-busting) -->
    <link rel="stylesheet" href="styles.css?v=2025-08-11-1" />
  </head>
  <body>
    <!-- NL: Achtergrond-bubbels over de hele pagina -->
    <div id="bubbles-bg" class="bubbles-bg" aria-hidden="true"></div>
    <!-- NL: Volledige container voor de applicatie -->
    <div class="fullscreen-container">
      <header class="main-header">
        <h1>The Beer Name Generator</h1>
        <p>Craft the perfect name for your brew</p>
      </header>

      <div class="main-content">
        <section class="beer-generator">
          <h2>Discover Your Perfect Brew</h2>

          <!-- NL: Resultaatgedeelte met naam + specificaties -->
          <div class="result-container">
            <div class="beer-name-container">
              <div class="bubbles" id="bubbles"></div>
              <div class="beer-specs" id="beer-specs" aria-live="polite">
                <div id="random-name" class="beer-name-text" aria-live="polite">
                  Click below and savor the surprise!
                </div>
                <div class="spec-item">
                  <div class="spec-label">Style</div>
                  <div class="spec-value" id="spec-style">-</div>
                </div>
                <div class="spec-item">
                  <div class="spec-label">ABV</div>
                  <div class="spec-value" id="spec-abv">-</div>
                </div>
                <div class="spec-item">
                  <div class="spec-label">IBU</div>
                  <div class="spec-value" id="spec-ibu">-</div>
                </div>
                <div class="spec-item">
                  <div class="spec-label">Origin</div>
                  <div class="spec-value" id="spec-origin">-</div>
                </div>
              </div>
            </div>
          </div>

          <!-- NL: Knoppen en statusbalk -->
          <div class="controls-area">
            <div class="button-group">
              <button
                type="button"
                class="btn primary-btn"
                id="generate"
                aria-label="Generate new beer name"
              >
                <i class="fas fa-beer" aria-hidden="true"></i> Generate
              </button>

              <button
                type="button"
                class="btn secondary-btn"
                id="auto-generate"
                aria-label="Automatically generate beer names every 10 seconds"
              >
                <i class="fas fa-sync-alt" aria-hidden="true"></i> Auto Generate
              </button>

              <button
                type="button"
                class="btn secondary-btn"
                id="generate-image-btn"
                aria-label="Generate beer label image using Midjourney"
              >
                <i class="fas fa-image" aria-hidden="true"></i> Generate Image
              </button>
            </div>

            <div class="status-bar">
              <div class="status-info">
                <span id="generation-count">0 beers crafted</span>
              </div>
              <button
                type="button"
                class="theme-toggle"
                id="theme-toggle"
                aria-label="Toggle dark mode"
              >
                <i class="fas fa-moon" aria-hidden="true"></i> Dark Mode
              </button>
              <!-- NL: Link naar visuele structuur uitleg -->
              <a
                class="theme-toggle structure-link"
                href="structure.html"
                aria-label="View app structure"
              >
                <i class="fas fa-sitemap" aria-hidden="true"></i> Structure
              </a>
            </div>
          </div>
        </section>

        <!-- NL: Geschiedenis paneel -->
        <button
          type="button"
          id="history-toggle"
          title="View History"
          aria-label="View beer history"
          aria-expanded="false"
          aria-controls="history-panel"
        >
          <i class="fas fa-history" aria-hidden="true"></i>
        </button>

        <section
          class="history"
          id="history-panel"
          aria-labelledby="history-heading"
        >
          <h3 id="history-heading">
            <span>Brewing History</span>
            <button
              type="button"
              class="clear-btn"
              id="clear-history"
              aria-label="Clear history"
            >
              <i class="fas fa-trash" aria-hidden="true"></i> Clear
            </button>
          </h3>

          <div id="history-list" aria-live="polite">
            <!-- History items will be added here -->
          </div>
        </section>
      </div>

      <footer class="main-footer">
        <p>🍻 © 2025 Beer Name Generator | Crafted with ❤️ by Yoshi Tacke</p>
      </footer>
    </div>

    <script>
      // NL: Maak willekeurige 'bubbels' voor visueel effect (in het glas)
      // Create floating bubbles (in-glass)
      function createBubbles() {
        const bubblesContainer = document.getElementById('bubbles');
        if (!bubblesContainer) return;

        setInterval(() => {
          const bubble = document.createElement('div');
          bubble.className = 'bubble';
          const size = Math.random() * 12 + 6; // iets groter
          bubble.style.width = size + 'px';
          bubble.style.height = size + 'px';
          bubble.style.left = Math.random() * 100 + '%';
          bubble.style.animationDuration = Math.random() * 6 + 8 + 's';
          bubble.style.animationDelay = Math.random() * 2 + 's';
          bubblesContainer.appendChild(bubble);

          setTimeout(() => bubble.remove(), 15000);
        }, 800); // hogere frequentie
      }

      createBubbles();

      // NL: Achtergrond-bubbels door de hele pagina
      function createBackgroundBubbles() {
        const bg = document.getElementById('bubbles-bg');
        if (!bg) return;

        setInterval(() => {
          const b = document.createElement('div');
          b.className = 'bg-bubble';
          const size = Math.random() * 20 + 10; // grotere achtergrondbellen
          b.style.width = size + 'px';
          b.style.height = size + 'px';
          b.style.left = Math.random() * 100 + '%';
          // start willekeurig onderaan
          b.style.bottom = -20 - Math.random() * 40 + 'px';
          b.style.animationDuration = Math.random() * 10 + 12 + 's';
          b.style.animationDelay = Math.random() * 2 + 's';
          bg.appendChild(b);

          setTimeout(() => b.remove(), 20000);
        }, 600);
      }

      createBackgroundBubbles();

      // NL: Toggle voor het geschiedenis-paneel
      // History panel toggle
      document.addEventListener('DOMContentLoaded', function () {
        const historyToggleBtn = document.getElementById('history-toggle');
        const historyPanel = document.querySelector('.history');

        if (historyToggleBtn && historyPanel) {
          historyToggleBtn.addEventListener('click', function () {
            const isExpanded = historyPanel.classList.contains('show');
            historyPanel.classList.toggle('show');

            // Update ARIA attributes for accessibility
            historyToggleBtn.setAttribute('aria-expanded', !isExpanded);

            // Update icon with better accessibility
            const newIcon = !isExpanded
              ? '<i class="fas fa-chevron-down" aria-hidden="true"></i>'
              : '<i class="fas fa-history" aria-hidden="true"></i>';
            historyToggleBtn.innerHTML = newIcon;
            
            // Update aria-label for better screen reader support
            const newLabel = !isExpanded ? 'Close beer history' : 'View beer history';
            historyToggleBtn.setAttribute('aria-label', newLabel);
          });
          
          // Add keyboard support for history panel
          historyToggleBtn.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              historyToggleBtn.click();
            }
          });
        }
      });
    </script>

    <!-- Axios for HTTP requests -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Main JavaScript (cache-busting) -->
    <script src="main.js?v=2025-08-11-1" defer></script>

    <!-- Midjourney Integration (cache-busting) -->
    <script
      src="midjourney-integration.js?v=2025-08-11-1"
      defer
    ></script>
  </body>
</html>
