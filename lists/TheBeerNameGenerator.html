<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Beer Name Generator</title>
  <link rel="stylesheet" href="TheBeerNameGenerator.css">

  <!-- Fonts: Chosen specially for better beer vibe -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- Font Awesome voor de originele icoontjes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Aanpassingen om ervoor te zorgen dat alles op 1920x1080 past zonder uitzoomen */
    html, body {
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .fullscreen-container {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-height: 1080px;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
    }

    .main-header {
      padding: 0.8rem 2rem;
      text-align: center;
      background: var(--gradient-header);
    }

    .main-header h1 {
      font-size: 2.5rem;
      margin: 0;
    }

    .main-header p {
      margin: 0.3rem 0 0;
      font-size: 1rem;
    }

    .main-content {
      display: grid;
      grid-template-columns: 7fr 3fr;
      gap: 1.5rem;
      padding: 1rem 2rem;
      height: calc(100% - 4rem);
      overflow: hidden;
    }

    .left-column {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .beer-generator {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-soft);
      padding: 1.2rem;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .right-column {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .history {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-soft);
      padding: 1.2rem;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .beer-generator h2 {
      margin-top: 0;
      font-size: 1.3rem;
      margin-bottom: 0.8rem;
      color: var(--accent-color);
      text-align: center;
      border-bottom: 1px solid rgba(195, 129, 84, 0.3);
      padding-bottom: 0.5rem;
    }

    .history h3 {
      margin-top: 0;
      font-size: 1.2rem;
      margin-bottom: 0.8rem;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(195, 129, 84, 0.3);
      padding-bottom: 0.5rem;
    }

    #history-list {
      flex-grow: 1;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    #history-list div {
      padding: 0.5rem 0.8rem;
      margin-bottom: 0.5rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--accent-color);
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .main-footer {
      padding: 0.5rem 1rem;
      background: var(--secondary-color);
      color: white;
      text-align: center;
      font-size: 0.9rem;
    }

    .main-footer p {
      margin: 0;
    }

    /* Grote prominente weergave voor de biernaam */
    .result-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
      position: relative;
    }

    #random-name {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      padding: 0;
      overflow: hidden;
    }

    /* Decoratieve elementen voor de biernaam */
    .beer-name-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .beer-name-container::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 95%;
      height: 90%;
      background: rgba(255, 255, 255, 0.07);
      border-radius: var(--border-radius);
      border: 1px solid rgba(195, 129, 84, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      z-index: 0;
    }

    .beer-name-container::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      height: 75%;
      border: 2px dashed rgba(195, 129, 84, 0.2);
      border-radius: calc(var(--border-radius) - 4px);
      z-index: 0;
    }

    /* Decoratieve bier-iconen in de achtergrond */
    .beer-decorations {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 0;
      opacity: 0.07;
      pointer-events: none;
    }

    .beer-icon {
      position: absolute;
      font-size: 2rem;
      color: var(--accent-color);
    }

    .beer-icon:nth-child(1) { top: 10%; left: 10%; }
    .beer-icon:nth-child(2) { top: 15%; right: 15%; }
    .beer-icon:nth-child(3) { bottom: 10%; left: 20%; }
    .beer-icon:nth-child(4) { bottom: 20%; right: 10%; }

    .beer-name-text {
      font-size: 2.2rem;
      line-height: 1.3;
      color: var(--accent-color);
      font-weight: bold;
      max-width: 90%;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.15);
      transition: all 0.5s;
      z-index: 1;
      animation: float 6s ease-in-out infinite;
    }

    /* Dynamische tekstgrootte-aanpassing in JavaScript */
    .medium-text {
      font-size: 1.8rem !important;
    }

    .small-text {
      font-size: 1.5rem !important;
    }

    .smaller-text {
      font-size: 1.2rem !important;
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 0.5rem;
    }

    .btn {
      padding: 0.7rem 1.3rem;
      font-size: 1rem;
      border-radius: 50px;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
    }

    .primary-btn {
      background: var(--gradient-primary);
      color: white;
      font-weight: bold;
    }

    .primary-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }

    .secondary-btn {
      background: var(--secondary-color);
      color: white;
    }

    .secondary-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }

    .controls-area {
      margin-top: auto;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    .theme-toggle {
      background: none;
      border: none;
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .theme-toggle:hover {
      background: rgba(195, 129, 84, 0.1);
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--accent-color);
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.4rem 0.7rem;
      border-radius: 4px;
      transition: background 0.2s;
      margin-left: auto;
    }

    .clear-btn:hover {
      background: rgba(195, 129, 84, 0.1);
    }

    /* Active state styling */
    .secondary-btn.active {
      background: #a83232;
    }

    /* Zorgt voor een betere leesbaarheid van de tekst in de donkere modus */
    body.dark-mode .beer-name-container::before {
      background: rgba(0, 0, 0, 0.2);
    }

    body.dark-mode #history-list div {
      background: rgba(0, 0, 0, 0.2);
    }

    /* Animatie voor het zweven van de bierletters */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    /* Automatische tekstgrootte aanpassing */
    @media (max-width: 1600px) {
      .beer-name-text {
        font-size: 1.8rem;
      }
    }

    @media (max-width: 1400px) {
      .beer-name-text {
        font-size: 1.6rem;
      }
    }
  </style>

  <!-- Script om de lettergrootte aan te passen, zal worden overschreven door TheBeerNameGenerator.js -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const adjustTextSize = () => {
        const resultElement = document.getElementById('random-name');
        if (!resultElement) return;

        const text = resultElement.textContent || resultElement.innerText;

        resultElement.classList.remove('medium-text', 'small-text', 'smaller-text');

        if (text.length > 200) {
          resultElement.classList.add('smaller-text');
        } else if (text.length > 130) {
          resultElement.classList.add('small-text');
        } else if (text.length > 75) {
          resultElement.classList.add('medium-text');
        }
      };

      // Observer voor dynamische updates
      const observer = new MutationObserver(adjustTextSize);
      const resultElement = document.getElementById('random-name');
      if (resultElement) {
        observer.observe(resultElement, {
          childList: true,
          characterData: true,
          subtree: true
        });
      }

      // Clear knop functionaliteit (als fallback)
      const clearBtn = document.getElementById('clear-history');
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          const historyList = document.getElementById('history-list');
          if (historyList) historyList.innerHTML = '';
        });
      }
    });
  </script>

  <!-- Main JavaScript -->
  <script src="TheBeerNameGenerator.js" defer></script>
</head>
<body>
  <div class="fullscreen-container">
    <header class="main-header">
      <h1>The Beer Name Generator</h1>
      <p>Craft the perfect name for your brew</p>
    </header>

    <div class="main-content">
      <div class="left-column">
        <section class="beer-generator">
          <h2>Discover Your Perfect Brew</h2>

          <div class="result-container">
            <div class="beer-name-container">
              <!-- Decoratieve biericonen in de achtergrond -->
              <div class="beer-decorations">
                <i class="fas fa-beer beer-icon"></i>
                <i class="fas fa-glass-cheers beer-icon"></i>
                <i class="fas fa-wine-bottle beer-icon"></i>
                <i class="fas fa-wine-glass-alt beer-icon"></i>
              </div>

              <!-- ID moet exact 'random-name' zijn voor JavaScript-compatibiliteit -->
              <div id="random-name" class="beer-name-text">
                Click below and savor the surprise!
              </div>
            </div>
          </div>

          <div class="controls-area">
            <div class="button-group">
              <button class="btn primary-btn" id="generate">
                <i class="fas fa-beer"></i> Generate
              </button>

              <button class="btn secondary-btn" id="auto-generate">
                <i class="fas fa-sync-alt"></i> Generate Every 10 Secs
              </button>
            </div>

            <div class="status-bar">
              <div class="status-info">
                <span id="generation-count">0 names generated</span>
              </div>
              <button class="theme-toggle" id="theme-toggle">
                <i class="fas fa-moon"></i> Toggle Dark Mode
              </button>
            </div>
          </div>
        </section>
      </div>

      <div class="right-column">
        <section class="history">
          <h3>
            <span>Generation History</span>
            <button class="clear-btn" id="clear-history">
              <i class="fas fa-trash"></i> Clear
            </button>
          </h3>

          <div id="history-list">
            <!-- History items will be added here by JavaScript -->
          </div>
        </section>
      </div>
    </div>

    <footer class="main-footer">
      <p>🍻 &copy; 2025 Beer Name Generator | Crafted by Yoshi Tacke</p>
    </footer>
  </div>
</body>
</html>
